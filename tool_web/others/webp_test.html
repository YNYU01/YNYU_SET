<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebP 动画 RIFF 极简测试</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        img { margin-top: 20px; border: 1px solid #ccc; max-width: 300px; }
    </style>
</head>
<body>
    <h2>WebP 动画 RIFF 拼接测试</h2>
    <button id="btn">点击生成 WebP 动画</button>
    <div id="result"></div>

    <script>
        // 1. 极简构造一个合法的静态 WebP 二进制数据
        // 注意：这是一个最小化的 VP8L (无损) 图像数据块
        // 实际业务中，这里会被 canvas.toBlob() 输出的真实数据替换
        function createFakeStaticWebP(r, g, b) {
            // 这里硬编码了一个 1x1 像素的合法 VP8L WebP 结构
            // 仅用于测试 RIFF 容器拼接是否合法
            const vp8lData = new Uint8Array([
                0x56, 0x50, 0x38, 0x4C, // 'VP8L'
                0x09, 0x00, 0x00, 0x00, // Size: 9 bytes
                0x2F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00 // VP8L Payload
            ]);
            return vp8lData;
        }

        // 2. 构建标准的 RIFF Chunk
        function buildChunk(fourCC, data) {
            const size = data.length;
            const padding = size % 2; 
            const chunk = new Uint8Array(8 + size + padding);
            for (let i = 0; i < 4; i++) chunk[i] = fourCC.charCodeAt(i);
            const view = new DataView(chunk.buffer);
            view.setUint32(4, size, true); // 小端序写入 Size
            chunk.set(data, 8);
            return chunk;
        }

        // 3. 核心拼装逻辑
        async function encodeTestAnimation() {
            const width = 100;
            const height = 100;
            const frameDuration = 500; // 500ms 切换一次，方便肉眼观察

            // 获取两帧假数据
            const frame1 = createFakeStaticWebP(255, 0, 0);
            const frame2 = createFakeStaticWebP(0, 255, 0);

            const chunks = [];

            // 3.1 构建 VP8X 扩展头
            // Flags: 0x10 表示包含动画
            // 宽高需要减去 1，并用 24位小端序写入
            const vp8xPayload = new Uint8Array([
                0x10, 0x00, 0x00, 0x00, // Flags
                (width - 1) & 0xFF, ((width - 1) >> 8) & 0xFF, ((width - 1) >> 16) & 0xFF, // Width - 1
                (height - 1) & 0xFF, ((height - 1) >> 8) & 0xFF, ((height - 1) >> 16) & 0xFF // Height - 1
            ]);
            chunks.push(buildChunk('VP8X', vp8xPayload));

            // 3.2 构建 ANIM 全局控制块
            const animPayload = new Uint8Array([
                0xFF, 0xFF, 0xFF, 0xFF, // 背景色 (BGRA)
                0x00, 0x00              // 循环次数 (0 = 无限循环)
            ]);
            chunks.push(buildChunk('ANIM', animPayload));

            // 3.3 构建 ANMF 动画帧块
            for (const frame of [frame1, frame2]) {
                const frameHeader = new Uint8Array([
                    0x00, 0x00, 0x00, 0x00, // Frame X, Y 坐标 (0,0)
                    (width - 1) & 0xFF, ((width - 1) >> 8) & 0xFF, ((width - 1) >> 16) & 0xFF, // Width - 1
                    (height - 1) & 0xFF, ((height - 1) >> 8) & 0xFF, ((height - 1) >> 16) & 0xFF, // Height - 1
                    frameDuration & 0xFF, (frameDuration >> 8) & 0xFF, (frameDuration >> 16) & 0xFF, // Duration
                    0x00 // Flags (0x00 = 覆盖绘制)
                ]);
                
                const anmfPayload = new Uint8Array(frameHeader.length + frame.length);
                anmfPayload.set(frameHeader);
                anmfPayload.set(frame, frameHeader.length);
                chunks.push(buildChunk('ANMF', anmfPayload));
            }

            // 4. 拼装最终的 RIFF 文件头
            const totalChunkSize = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
            const riffHeader = new ArrayBuffer(12);
            const headerView = new DataView(riffHeader);
            headerView.setUint32(0, 0x46464952, false); // 'RIFF'
            headerView.setUint32(4, totalChunkSize + 4, true); // 文件大小 - 8
            headerView.setUint32(8, 0x50424557, false); // 'WEBP'

            // 5. 合并并展示
            const blob = new Blob([riffHeader, ...chunks], { type: 'image/webp' });
            const url = URL.createObjectURL(blob);
            
            const img = document.createElement('img');
            img.src = url;
            document.getElementById('result').innerHTML = '';
            document.getElementById('result').appendChild(img);
            
            // 顺便提供下载
            const a = document.createElement('a');
            a.href = url;
            a.download = 'test-animation.webp';
            a.innerText = ' (右键另存为下载)';
            document.getElementById('result').appendChild(a);
        }

        document.getElementById('btn').addEventListener('click', encodeTestAnimation);
    </script>
</body>
</html>
