<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAG 帧导出工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
  
  .header { background: #16213e; padding: 16px 24px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; color: #e94560; }
  .header .subtitle { font-size: 13px; color: #888; }

  .container { display: flex; height: calc(100vh - 57px); }

  /* 左侧文件列表 */
  .sidebar { width: 280px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; }
  .sidebar-header { padding: 12px 16px; border-bottom: 1px solid #0f3460; }
  .import-btn { width: 100%; padding: 10px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.2s; }
  .import-btn:hover { background: #c73650; }
  .file-list { flex: 1; overflow-y: auto; padding: 8px; }
  .file-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; transition: background 0.15s; display: flex; justify-content: space-between; align-items: center; }
  .file-item:hover { background: #1a1a3e; }
  .file-item.active { background: #0f3460; border-left: 3px solid #e94560; }
  .file-item .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .file-item .info { font-size: 11px; color: #888; }
  .file-item .remove-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; display: none; }
  .file-item:hover .remove-btn { display: block; }
  .file-item .remove-btn:hover { color: #e94560; background: rgba(233,69,96,0.1); }

  /* 右侧主区域 */
  .main { flex: 1; display: flex; flex-direction: column; }
  .preview-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #111; position: relative; overflow: hidden; }
  .preview-area canvas { max-width: 90%; max-height: 90%; }
  .preview-placeholder { color: #555; font-size: 16px; text-align: center; }

  /* 底部控制面板 */
  .controls { background: #16213e; border-top: 1px solid #0f3460; padding: 16px 24px; }
  .control-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
  .control-row:last-child { margin-bottom: 0; }
  .control-group { display: flex; align-items: center; gap: 8px; }
  .control-group label { font-size: 13px; color: #aaa; white-space: nowrap; }
  .control-group input[type="number"] { width: 70px; padding: 6px 8px; background: #1a1a2e; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-size: 13px; text-align: center; }
  .control-group select { padding: 6px 10px; background: #1a1a2e; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-size: 13px; }
  .slider-container { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px; }
  .slider-container input[type="range"] { flex: 1; accent-color: #e94560; }
  .slider-container .frame-label { font-size: 13px; color: #e94560; min-width: 80px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #c73650; }
  .btn-primary:disabled { background: #555; cursor: not-allowed; }
  .btn-secondary { background: #0f3460; color: #e0e0e0; }
  .progress-bar { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
  .progress-bar .fill { height: 100%; background: #e94560; transition: width 0.1s; width: 0%; }
  .status { font-size: 12px; color: #888; margin-top: 6px; }

  /* 加载状态 */
  .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 10; }
  .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>PAG 帧导出工具</h1>
  <span class="subtitle">导入 .pag 文件 → 预览 → 导出指定帧</span>
</div>

<div class="container">
  <!-- 左侧文件列表 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="import-btn" id="importBtn">📂 导入 PAG 文件</button>
      <input type="file" id="fileInput" accept=".pag" multiple hidden>
    </div>
    <div class="file-list" id="fileList">
      <div class="preview-placeholder" style="padding: 24px; font-size: 13px;">暂无文件，点击上方按钮导入</div>
    </div>
  </div>

  <!-- 右侧主区域 -->
  <div class="main">
    <div class="preview-area" id="previewArea">
      <div class="preview-placeholder" id="placeholder">请先导入 .pag 文件</div>
      <canvas id="pagCanvas" style="display:none;"></canvas>
      <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
    </div>

    <div class="controls">
      <div class="control-row">
        <div class="slider-container">
          <label style="font-size:13px;color:#aaa;">帧进度</label>
          <input type="range" id="frameSlider" min="0" max="0" value="0" step="1" disabled>
          <span class="frame-label" id="frameLabel">0 / 0</span>
        </div>
        <button class="btn btn-secondary" id="playBtn" disabled>▶ 播放</button>
      </div>

      <div class="control-row">
        <div class="control-group">
          <label>导出模式</label>
          <select id="exportMode">
            <option value="single">单帧导出</option>
            <option value="range">区间导出</option>
          </select>
        </div>
        <div class="control-group" id="singleFrameGroup">
          <label>帧号</label>
          <input type="number" id="singleFrame" value="1" min="0">
        </div>
        <div class="control-group" id="rangeGroup" style="display:none;">
          <label>起始帧</label>
          <input type="number" id="startFrame" value="0" min="0">
          <label>结束帧</label>
          <input type="number" id="endFrame" value="0" min="0">
        </div>
        <div class="control-group">
          <label>格式</label>
          <select id="exportFormat">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
          </select>
        </div>
        <button class="btn btn-primary" id="exportBtn" disabled>导出帧</button>
        <button class="btn btn-primary" id="exportWebP" disabled>另存为webP</button>

      </div>

      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="statusText"></div>
    </div>
  </div>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/libpag@latest/lib/libpag.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // ===== 全局状态 =====
  const files = []; 
  let activeIndex = -1;
  let isPlaying = false;
  let animFrameId = null; 

  // ===== DOM 元素 =====
  const importBtn = document.getElementById('importBtn');
  const fileInput = document.getElementById('fileInput');
  const fileListEl = document.getElementById('fileList');
  const canvas = document.getElementById('pagCanvas');
  const placeholder = document.getElementById('placeholder');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const frameSlider = document.getElementById('frameSlider');
  const frameLabel = document.getElementById('frameLabel');
  const playBtn = document.getElementById('playBtn');
  const exportMode = document.getElementById('exportMode');
  const singleFrameGroup = document.getElementById('singleFrameGroup');
  const rangeGroup = document.getElementById('rangeGroup');
  const singleFrameInput = document.getElementById('singleFrame');
  const startFrameInput = document.getElementById('startFrame');
  const endFrameInput = document.getElementById('endFrame');
  const exportFormat = document.getElementById('exportFormat');
  const exportBtn = document.getElementById('exportBtn');
  const exportWebP = document.getElementById('exportWebP');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const statusText = document.getElementById('statusText');
  let PAG = null;

  // ===== 导入文件 =====
  importBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    if (!e.target.files.length) return;
     PAG = await window.libpag.PAGInit();

    for (const file of e.target.files) {
      await loadPagFile(file);
    }
    fileInput.value = '';
  });

  async function loadPagFile(file) {
    showLoading(true);
    setStatus(`正在加载: ${file.name} ...`);
    try {
      const buffer = await file.arrayBuffer();
      const pagFile = await PAG.PAGFile.load(buffer);
      const width = pagFile.width();
      const height = pagFile.height();
      const duration = pagFile.duration(); 
      const frameRate = pagFile.frameRate();
      const totalFrames = Math.round((duration / 1000000) * frameRate);

      const entry = {
        name: file.name,
        buffer,
        pagFile,
        pagView: null,
        totalFrames,
        frameRate,
        width,
        height,
      };

      files.push(entry);
      renderFileList();

      if (files.length === 1) {
        await selectFile(0);
      }

      setStatus(`✅ 已加载: ${file.name} (${width}×${height}, ${totalFrames}帧, ${frameRate}fps)`);
    } catch (e) {
      setStatus(`❌ 加载失败: ${file.name} - ${e.message}`);
    } finally {
      showLoading(false);
    }
  }

  // ===== 文件列表渲染 =====
  function renderFileList() {
    if (files.length === 0) {
      fileListEl.innerHTML = '<div class="preview-placeholder" style="padding:24px;font-size:13px;">暂无文件，点击上方按钮导入</div>';
      return;
    }
    fileListEl.innerHTML = files.map((f, i) => `
      <div class="file-item ${i === activeIndex ? 'active' : ''}" data-index="${i}">
        <div>
          <div class="name" title="${f.name}">${f.name}</div>
          <div class="info">${f.width}×${f.height} · ${f.totalFrames}帧 · ${f.frameRate}fps</div>
        </div>
        <button class="remove-btn" data-remove="${i}" title="移除">✕</button>
      </div>
    `).join('');

    fileListEl.querySelectorAll('.file-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.dataset.remove !== undefined) return;
        selectFile(parseInt(el.dataset.index));
      });
    });
    fileListEl.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFile(parseInt(btn.dataset.remove));
      });
    });
  }

  async function removeFile(index) {
    if (files[index].pagView) files[index].pagView.destroy();
    files.splice(index, 1);
    if (activeIndex >= files.length) activeIndex = files.length - 1;
    renderFileList();
    if (files.length === 0) {
      canvas.style.display = 'none';
      placeholder.style.display = 'block';
      playBtn.disabled = true;
      exportBtn.disabled = true;
      frameSlider.disabled = true;
      activeIndex = -1;
    } else {
      await selectFile(activeIndex);
    }
  }

  // ===== 选中文件并预览 =====
  async function selectFile(index) {
    stopPlay();
    if (activeIndex >= 0 && files[activeIndex]?.pagView) {
      files[activeIndex].pagView.destroy();
      files[activeIndex].pagView = null;
    }

    activeIndex = index;
    const entry = files[index];
    if (!entry) return;

    canvas.width = entry.width;
    canvas.height = entry.height;
    canvas.style.display = 'block';
    placeholder.style.display = 'none';

    entry.pagView = await PAG.PAGView.init(entry.pagFile, canvas, { useScale: false });

    frameSlider.max = entry.totalFrames - 1;
    frameSlider.value = 0;
    frameSlider.disabled = false;
    singleFrameInput.max = entry.totalFrames - 1;
    startFrameInput.max = entry.totalFrames - 1;
    endFrameInput.max = entry.totalFrames - 1;
    endFrameInput.value = entry.totalFrames - 1;
    playBtn.disabled = false;
    exportBtn.disabled = false;
    exportWebP.disabled = false;
    updateFrameLabel(0, entry.totalFrames);

    renderFileList();
  }

  // ===== 帧滑块控制 =====
  frameSlider.addEventListener('input', async () => {
    const frame = parseInt(frameSlider.value);
    const entry = files[activeIndex];
    if (!entry?.pagView) return;
    await seekToFrame(frame);
    updateFrameLabel(frame, entry.totalFrames);
  });

  async function seekToFrame(frame) {
    const entry = files[activeIndex];
    if (!entry?.pagView) return;
    const progress = entry.totalFrames > 1 ? frame / (entry.totalFrames - 1) : 0;
    await entry.pagView.setProgress(progress);
    await entry.pagView.flush();
  }

  function updateFrameLabel(current, total) {
    frameLabel.textContent = `${current} / ${total - 1}`;
  }

  // ===== 播放控制 =====
  playBtn.addEventListener('click', () => {
    if (isPlaying) stopPlay();
    else startPlay();
  });

  function startPlay() {
    const entry = files[activeIndex];
    if (!entry?.pagView) return;
    isPlaying = true;
    playBtn.textContent = '⏸ 暂停';
    entry.pagView.play();

    const updateLoop = () => {
      if (!isPlaying) return;
      const progress = entry.pagView.getProgress();
      const frame = Math.round(progress * (entry.totalFrames - 1));
      frameSlider.value = frame;
      updateFrameLabel(frame, entry.totalFrames);
      animFrameId = requestAnimationFrame(updateLoop);
    };
    updateLoop();
  }

  function stopPlay() {
    isPlaying = false;
    playBtn.textContent = '▶ 播放';
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    const entry = files[activeIndex];
    if (entry?.pagView) entry.pagView.pause();
  }

  // ===== 导出模式切换 =====
  exportMode.addEventListener('change', () => {
    if (exportMode.value === 'single') {
      singleFrameGroup.style.display = 'flex';
      rangeGroup.style.display = 'none';
    } else {
      singleFrameGroup.style.display = 'none';
      rangeGroup.style.display = 'flex';
    }
  });

  // ===== 导出帧 =====
  exportBtn.addEventListener('click', async () => {
    const entry = files[activeIndex];
    if (!entry?.pagView) return;

    stopPlay();

    const format = exportFormat.value;
    const mimeType = `image/${format}`;
    const quality = format === 'png' ? undefined : 0.92;
    const ext = format === 'jpeg' ? 'jpg' : format;
    const baseName = entry.name.replace(/\.pag$/i, '');

    if (exportMode.value === 'single') {
      // 单帧导出
      const frame = parseInt(singleFrameInput.value) || 0;
      await seekToFrame(frame);
      await exportCanvasFrame(canvas, `${baseName}_frame_${padZero(frame)}.${ext}`, mimeType, quality);
      setStatus(`✅ 已导出第 ${frame} 帧`);
    } else {
      // 区间导出
      const start = parseInt(startFrameInput.value) || 0;
            const end = parseInt(endFrameInput.value) || entry.totalFrames - 1;
      if (start > end) {
        setStatus('❌ 起始帧不能大于结束帧');
        return;
      }

      const total = end - start + 1;
      exportBtn.disabled = true;
      progressBar.style.display = 'block';
      setStatus(`正在导出 ${total} 帧...`);

      // 动态加载 JSZip（用于打包多帧图片）
      await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      const zip = new JSZip();
      const folder = zip.folder(baseName);

      for (let frame = start; frame <= end; frame++) {
        await seekToFrame(frame);
        const blob = await canvasToBlob(canvas, mimeType, quality);
        folder.file(`${baseName}_frame_${padZero(frame)}.${ext}`, blob);
        const progress = ((frame - start + 1) / total) * 100;
        progressFill.style.width = `${progress}%`;
        setStatus(`正在导出... ${frame - start + 1} / ${total} 帧`);
        // 让出主线程，防止浏览器假死
        await sleep(10);
      }

      const zipBlob = await zip.generateAsync({ type: 'blob' }, (meta) => {
        progressFill.style.width = `${meta.percent.toFixed(1)}%`;
      });
      downloadBlob(zipBlob, `${baseName}_frames.zip`);
      setStatus(`✅ 已导出 ${total} 帧到 ZIP 文件`);

      exportBtn.disabled = false;
      setTimeout(() => { 
        progressBar.style.display = 'none'; 
        progressFill.style.width = '0%'; 
      }, 1500);
    }
  });

// 导出webP
exportWebP.addEventListener('click', async () => {
    const entry = files[activeIndex];
    if (!entry || !entry.pagView) {
        setStatus('❌ 请先导入并选择一个 .pag 文件');
        return;
    }

    const totalFrames = entry.totalFrames;
    const fps = entry.frameRate || 30;
    
    let startFrame = parseInt(startFrameInput.value) || 0;
    let endFrame = parseInt(endFrameInput.value) || (totalFrames - 1);

    // 边界检查
    startFrame = Math.max(0, startFrame);
    endFrame = Math.min(totalFrames - 1, endFrame);
    
    if (startFrame > endFrame) {
        setStatus('❌ 起始帧不能大于结束帧');
        return;
    }

    const exportTotalFrames = endFrame - startFrame + 1;
    const MAX_FRAMES_WARNING = 150; // 建议限制帧数，防止 OOM

    if (exportTotalFrames > MAX_FRAMES_WARNING) {
        if (!confirm(`⚠️ 警告：即将导出 ${exportTotalFrames} 帧。\nFFmpeg WASM 需将所有帧暂存内存，可能导致浏览器崩溃。\n建议分段导出。\n是否继续？`)) {
            return;
        }
    }

    const btn = exportWebP;
    const originalText = btn.innerText;
    btn.disabled = true;
    btn.innerText = '初始化引擎...';
    progressBar.style.display = 'block';
    progressFill.style.width = '0%';

    let ffmpeg = null;

    try {
        // 1. 单例模式加载 FFmpeg (适配GitHub Pages)
      if (!window.FFmpegInstance) {
          setStatus(`正在加载编码核心 (首次约 26MB，请稍候)...`);
          await loadScript('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js');
          const { createFFmpeg } = FFmpeg;
          
          window.FFmpegInstance = createFFmpeg({ 
              log: false,
              // 替换为官方存在的标准core包，显式指定worker路径
              corePath: './ffmpeg-core.js',
              workerPath: './ffmpeg-core.worker.js',
              thread: false
            });
          await window.FFmpegInstance.load();
      }
      ffmpeg = window.FFmpegInstance;

      if (!ffmpeg.isLoaded()) {
          await ffmpeg.load();
      }



        setStatus(`开始渲染并写入 ${exportTotalFrames} 帧...`);
        btn.innerText = '渲染中...';

        // 2. 逐帧渲染并写入 FS
        for (let i = startFrame; i <= endFrame; i++) {
            await seekToFrame(i);
            
            // 获取 PNG Blob (无损中间格式)
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (!blob) throw new Error('Canvas 读取失败');
            
            const frameName = `frame_${String(i - startFrame).padStart(4, '0')}.png`;
            
            // 写入虚拟文件系统
            ffmpeg.FS('writeFile', frameName, await FFmpeg.fetchFile(blob));

            // 更新进度并让出主线程
            const progress = ((i - startFrame + 1) / exportTotalFrames) * 100;
            progressFill.style.width = `${progress}%`;
            setStatus(`渲染进度: ${i - startFrame + 1} / ${exportTotalFrames}`);
            
            if (i % 5 === 0) await sleep(0); // 防止 UI 卡死
        }

        setStatus(`FFmpeg 正在编码动态 WebP...`);
        btn.innerText = '编码中...';

        // 3. 执行编码命令
        await ffmpeg.run(
            '-framerate', String(fps),
            '-i', 'frame_%04d.png',
            '-c:v', 'libwebp',
            '-q:v', '75',       // 质量 0-100
            '-loop', '0',       // 无限循环
            '-preset', 'picture', // 适合图文类动画
            '-y',               // 覆盖输出
            'output.webp'
        );

        // 4. 读取结果
        const data = ffmpeg.FS('readFile', 'output.webp');
        const webpBlob = new Blob([data], { type: 'image/webp' });

        if (!webpBlob || webpBlob.size === 0) {
            throw new Error("WebP 编码返回为空");
        }

        // 5. 触发下载
        const baseName = entry.name ? entry.name.replace(/\.pag$/i, '') : 'animation';
        const url = URL.createObjectURL(webpBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${baseName}_anim.webp`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        setStatus(`✅ 导出成功！大小: ${(webpBlob.size / 1024).toFixed(1)} KB`);

    } catch (error) {
        console.error('导出失败:', error);
        setStatus(`❌ 导出失败: ${error.message}`);
    } finally {
        // 6. 关键：清理虚拟文件系统，释放内存
        if (ffmpeg && ffmpeg.isLoaded()) {
            try {
                const filesInFS = ffmpeg.FS('readdir', '/');
                filesInFS.forEach(filename => {
                    if (filename.startsWith('frame_') || filename === 'output.webp') {
                        try { ffmpeg.FS('unlink', filename); } catch(e) {}
                    }
                });
            } catch (e) {
                console.warn('清理 FS 失败', e);
            }
        }

        btn.disabled = false;
        btn.innerText = originalText;
        setTimeout(() => {
            progressBar.style.display = 'none';
            progressFill.style.width = '0%';
        }, 1500);
    }
});



// ===== 工具函数 =====
  function canvasToBlob(cvs, mimeType, quality) {
    return new Promise((resolve) => {
      cvs.toBlob((blob) => resolve(blob), mimeType, quality);
    });
  }

  async function exportCanvasFrame(cvs, filename, mimeType, quality) {
    const blob = await canvasToBlob(cvs, mimeType, quality);
    downloadBlob(blob, filename);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function padZero(n) {
    return String(n).padStart(5, '0');
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  function showLoading(show) {
    loadingOverlay.style.display = show ? 'flex' : 'none';
  }

  function setStatus(text) {
    statusText.textContent = text;
  }

}); // DOMContentLoaded 结束
</script>
</body>
</html>
